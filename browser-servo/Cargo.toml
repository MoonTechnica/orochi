# Its own workspace: Servo builds SpiderMonkey, which the binary's CI must never wait for.
[workspace]

[package]
name = "orochi-servo"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
description = "Servo as the engine behind the window's browser tab (docs/servo-browser-design.md)"
license = "MPL-2.0"
publish = false

[dependencies]
servo = { version = "=0.8.0", default-features = false, features = ["bundled", "js_jit"] }
dpi = "0.1"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libc = "0.2"
euclid = "0.22"
keyboard-types = "0.8"
serde_json = "1"
cookie = "0.18"

[profile.release]
lto = "thin"
