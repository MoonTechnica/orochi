name: Release

# A tag builds and publishes. Running it by hand builds everything and publishes nothing, which
# is the only honest way to find out whether a release would succeed before cutting one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI: "@tauri-apps/cli@^2"

jobs:
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The tag and the manifests are set apart, so they drift. A release that says one version
      # and installs another is worse than one that never happened.
      - name: The tag and the manifests must agree
        run: |
          set -eu
          . scripts/read-versions.sh
          for other in "$desktop" "$bundle"; do
            [ "$other" = "$cli" ] || {
              echo "versions differ: cli $cli, desktop $desktop, bundle $bundle" >&2
              exit 1
            }
          done
          [ "${GITHUB_REF_NAME#v}" = "$cli" ] || {
            echo "tag $GITHUB_REF_NAME does not name version $cli" >&2
            exit 1
          }
      - name: Open a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes
          notes=$(gh release view "$GITHUB_REF_NAME" --json body -q .body)
          printf '%s\n\n%s\n' "$(cat .github/release-preamble.md)" "$notes" |
            gh release edit "$GITHUB_REF_NAME" --notes-file -

  # The CLI, for people who want the terminal. Windows is absent on purpose: `chat/term.rs` reads
  # no keys there, so a Windows `orochi` in a terminal would accept no input. It is still built
  # below, as the binary the window carries.
  cli:
    needs: draft
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # 22.04 rather than the newest: a binary linked against a newer glibc will not start on
          # the distributions people are actually running.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: ./scripts/package.sh ${{ matrix.target }}
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --clobber

  # The browser engine, which `orochi setup` downloads on first run (`setup::install_servo`) and
  # which is in no app bundle: it is large, and a Servo build takes a long time. Unix targets
  # only. UNVERIFIED: this job has not run; the system packages are Servo's documented ones for
  # Linux and macOS and may need adjusting on the first hand-run.
  servo:
    needs: draft
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang python3 pkg-config \
            libfontconfig1-dev libfreetype6-dev libx11-dev libxcb1-dev libgl1-mesa-dev \
            libegl1-mesa-dev libssl-dev
      - if: runner.os == 'macOS'
        run: brew install cmake pkg-config
      - run: cargo build --release --locked --manifest-path browser-servo/Cargo.toml --target ${{ matrix.target }}
      - run: ./scripts/package-servo.sh ${{ matrix.target }}
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --clobber

  desktop:
    needs: draft
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.rust }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev
      # The window cannot be built without it: `externalBin` is checked at build-script time.
      - name: Put the CLI beside the window
        shell: bash
        run: ./scripts/sidecar.sh --release --target ${{ matrix.target }}
      - name: Bundle
        shell: bash
        env:
          # `bundle_dmg.sh` asks Finder over Apple Events to lay the window out, which fails where
          # nothing granted that permission; `CI` is what makes the bundler skip it. Actions sets
          # it already — it is written here so a hand-run build does not fail on cosmetics.
          CI: "true"
          # Signing: the Developer ID certificate as a base64 .p12. Notarization: an App Store
          # Connect API key (APPLE_API_KEY is its ID, APPLE_API_KEY_P8 the key itself, written to
          # a file below), as gitlas does — no one's Apple ID or password sits in CI. APPLE_ID and
          # APPLE_PASSWORD still work in its place. Left empty it builds unsigned, and macOS then
          # makes the user allow the app in System Settings.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        # A universal build lipos only the main binary, yet bundles every [[bin]] of the crate, so
        # it stopped at `orochi-remote` missing from target/universal-apple-darwin. There it is
        # built without bundling, `orochi-remote` is joined by hand from the two slices just
        # built (the same build, so the same features), and only then bundled.
        run: |
          set -eu
          # An unset secret arrives as an empty string, and the bundler reads a variable that is
          # present as one to use: it tried to import an empty certificate and stopped.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8 APPLE_ID APPLE_PASSWORD; do
            [ -n "${!name:-}" ] || unset "$name"
          done
          # The bundler takes the API key as a path. The secret may hold the PEM or its base64.
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            p8="$RUNNER_TEMP/AuthKey.p8"
            if printf '%s' "$APPLE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
              printf '%s' "$APPLE_API_KEY_P8" > "$p8"
            else
              printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$p8"
            fi
            export APPLE_API_KEY_PATH="$p8"
            unset APPLE_API_KEY_P8
          fi
          if [ "${{ matrix.target }}" != universal-apple-darwin ]; then
            npx --yes "$TAURI_CLI" build --target ${{ matrix.target }}
            exit 0
          fi
          npx --yes "$TAURI_CLI" build --target universal-apple-darwin --no-bundle
          for slice in aarch64-apple-darwin x86_64-apple-darwin; do
            [ -x "target/$slice/release/orochi-remote" ] ||
              cargo build --release --locked --bin orochi-remote --target "$slice"
          done
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/orochi-remote \
            target/aarch64-apple-darwin/release/orochi-remote \
            target/x86_64-apple-darwin/release/orochi-remote
          lipo -info target/universal-apple-darwin/release/orochi-remote
          npx --yes "$TAURI_CLI" bundle --target universal-apple-darwin
        working-directory: desktop/src-tauri
      - name: Gather what was bundled
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          # Fixed names, without the version: the README links to
          # releases/latest/download/<name>, which must not break on the next release.
          bundle=desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          take() {
            found=$(find "$bundle" -type f -name "$1")
            [ "$(printf '%s\n' "$found" | grep -c .)" = 1 ] || {
              echo "expected one $1 under $bundle, found: $found" >&2
              exit 1
            }
            cp "$found" "dist/$2"
          }
          case "${{ runner.os }}" in
          macOS) take '*.dmg' Orochi-macos-universal.dmg ;;
          Linux)
            take '*.AppImage' Orochi-linux-x86_64.AppImage
            take '*.deb' Orochi-linux-amd64.deb
            ;;
          Windows)
            take '*-setup.exe' Orochi-windows-x64-setup.exe
            take '*.msi' Orochi-windows-x64.msi
            ;;
          esac
          ls -l dist
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  publish:
    needs: [cli, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false \
            --repo "$GITHUB_REPOSITORY" --latest
