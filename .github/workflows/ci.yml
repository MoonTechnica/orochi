name: CI
on: [push, pull_request]
permissions:
  contents: read
# A newer push to the same branch makes the older run's answer moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# The dependencies are most of a cold build (5½ of the desktop job's 7 minutes, measured), so
# they are cached; only main writes the cache, which every branch reads.
env:
  CACHE_SAVE: ${{ github.ref == 'refs/heads/main' }}
jobs:
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - shell: pwsh
        run: ./tests/windows-launcher.ps1

  # The versions and commands are mise.toml's, so what passes here is what `mise run check`
  # passes on a laptop.
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.CACHE_SAVE }}
      - run: mise run fmt
      - run: mise run lint
      - run: mise run test

  # The window is its own crate, outside the workspace, and went unchecked here until its
  # clippy errors and failing tests had been on main for a week.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # The desktop tasks build into the CLI's target directory, so one cache holds both;
      # naming both crates keys it on both lockfiles.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> ../../target
          save-if: ${{ env.CACHE_SAVE }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev
      - run: mise run desktop:lint
      - run: mise run desktop:test

  # Windows ships the window, not the console: `chat/term.rs` reads no keys there and the suite
  # drives a pty, so what is shipped is compiled and the tests are not run. Keep this job green or
  # the desktop installer has no CLI to carry.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.CACHE_SAVE }}
      - run: cargo clippy --locked -- -D warnings
