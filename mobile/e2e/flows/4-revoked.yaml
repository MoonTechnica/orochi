# run-ios.sh emptied the desktop's device list and restarted it: this phone's token is refused.
appId: dev.orochi.mobile
---
- extendedWaitUntil:
    visible: 'Pair again'
    timeout: 60000
- takeScreenshot: ios-41-revoked-needs-pairing
# A revoked workspace shows recovery in its own screen. Home and switching remain reachable.
- assertVisible:
    id: workspace-home
- assertVisible: 'Remove this desktop'
- assertNotVisible:
    id: tab-conversations
- takeScreenshot: ios-home6-09-revoked-panel
- tapOn: 'Switch workspace.*'
- extendedWaitUntil:
    visible: '.*Add a desktop'
- takeScreenshot: ios-42-switcher-revoked
- tapOn: 'TakanorinoMac-Studio, Online'
- waitForAnimationToEnd
- tapOn:
    id: workspace-home
- waitForAnimationToEnd
- takeScreenshot: ios-43-home-revoked-desktop
- assertVisible: '.*, Needs pairing again'
- tapOn:
    id: open-settings
- waitForAnimationToEnd
- takeScreenshot: ios-44-settings
- takeScreenshot: ios-home6-05-settings-light
- tapOn: 'Notifications'
- tapOn:
    id: notifications-switch
- waitForAnimationToEnd
- takeScreenshot: ios-45-notification-permission
- tapOn: '(Allow|許可)'
- waitForAnimationToEnd
- takeScreenshot: ios-46-notifications-on
