<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orochi</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <button type="button" id="activity" title="Every conversation, by what it needs"><span class="label">Activity</span><span id="activity-count"></span></button>
      <button id="new-thread" title="Start a thread here"><span class="label">New thread</span></button>
    </header>
    <div id="projects-head">
      <span id="projects-label">Projects</span>
      <button type="button" id="add-project" title="Add a project" aria-label="Add a project"></button>
    </div>
    <nav id="projects" aria-label="Projects"></nav>
    <footer id="sidebar-foot">
      <div id="notice"></div>
      <div id="account-menu" role="menu" hidden></div>
      <button type="button" id="account" aria-haspopup="menu" aria-expanded="false">
        <span id="account-mark"></span>
        <span id="account-name">Orochi</span>
        <span id="account-chevron"></span>
      </button>
    </footer>
    <div class="resizer" id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize the sidebar" tabindex="0"></div>
  </aside>

  <main id="thread">
    <header id="thread-head">
      <span id="thread-where"></span>
      <span id="thread-title">Nothing selected</span>
      <span id="thread-status"></span>
    </header>
    <div id="timeline" role="log" aria-live="polite"></div>
    <form id="composer" autocomplete="off">
      <textarea id="message" rows="1" placeholder="Message…" aria-label="Message"></textarea>
      <div id="composer-row">
        <div id="folder-picker">
          <button type="button" id="folder" aria-haspopup="menu" aria-expanded="false">
            <span id="folder-name">No folder</span>
          </button>
          <div id="folder-menu" role="menu" hidden></div>
        </div>
        <div id="route-picker">
          <button type="button" id="route" aria-haspopup="menu" aria-expanded="false"><span id="route-name">Auto</span></button>
          <div id="route-menu" role="menu" hidden></div>
        </div>
        <button type="button" id="effort" title="How hard the agent thinks"><span id="effort-name">default</span></button>
        <span id="composer-hint">Cmd-Enter to send &middot; Enter for a new line</span>
        <button type="button" id="interrupt" hidden>Stop</button>
        <button type="submit" id="send">Send</button>
      </div>
    </form>
  </main>

  <aside id="side">
    <div class="resizer" id="side-resizer" role="separator" aria-orientation="vertical" aria-label="Resize the side pane" tabindex="0"></div>
    <div id="tabs" role="tablist">
      <button class="tab" data-pane="team" role="tab" aria-selected="true">Team</button>
      <button class="tab" data-pane="changes" role="tab" aria-selected="false">Changes</button>
      <button class="tab" data-pane="plan" role="tab" aria-selected="false">Plan</button>
      <button class="tab" data-pane="files" role="tab" aria-selected="false">Files</button>
    </div>
    <section id="pane-team" class="pane">
      <div id="roster"></div>
      <div id="room"></div>
      <form id="say-form">
        <input id="say" placeholder="Message the team…" aria-label="Message the team">
      </form>
      <p id="say-hint" class="empty">Delivered when the agent next checks.</p>
    </section>
    <section id="pane-changes" class="pane" hidden>
      <div id="scopes" role="tablist">
        <button type="button" class="scope" data-scope="turn" aria-selected="true">Last turn</button>
        <button type="button" class="scope" data-scope="unstaged" aria-selected="false">Unstaged</button>
        <button type="button" class="scope" data-scope="staged" aria-selected="false">Staged</button>
        <button type="button" class="scope" data-scope="branch" aria-selected="false">Branch</button>
      </div>
      <div id="files"></div>
      <form id="review-form" hidden>
        <div id="review-list"></div>
        <button type="submit" id="review-send">Send as a message</button>
      </form>
    </section>
    <section id="pane-plan" class="pane" hidden></section>
    <section id="pane-files" class="pane" hidden>
      <header id="files-head">
        <span id="files-where"></span>
        <button type="button" id="files-refresh" aria-label="Read the folder again"></button>
      </header>
      <input id="tree-search" type="search" placeholder="Search files…" aria-label="Search files">
      <div id="tree-by" role="tablist">
        <button type="button" class="by" data-by="name" aria-selected="true">Name</button>
        <button type="button" class="by" data-by="content" aria-selected="false">Content</button>
      </div>
      <div id="tree" role="tree" tabindex="0"></div>
      <div id="viewer" hidden></div>
    </section>
  </aside>

  <footer id="status-bar">
    <div id="accounts"></div>
    <div id="counts"></div>
  </footer>

  <dialog id="panel">
    <header id="panel-head">
      <h2 id="panel-title"></h2>
      <button type="button" id="panel-close" aria-label="Close"></button>
    </header>
    <div id="panel-body"></div>
  </dialog>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
