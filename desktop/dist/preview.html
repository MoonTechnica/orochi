<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orochi — preview</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <button type="button" id="office-btn" title="See every team at work"><span class="label">Office</span></button>
      <button type="button" id="activity" title="Every conversation, by what it needs"><span class="label">Activity</span><span id="activity-count"></span></button>
      <button id="new-thread" title="Start a thread here"><span class="label">New thread</span></button>
    </header>
    <div id="projects-head">
      <span id="projects-label">Projects</span>
      <button type="button" id="add-project" title="Add a project" aria-label="Add a project"></button>
    </div>
    <nav id="projects" aria-label="Projects"></nav>
    <footer id="sidebar-foot">
      <div id="notice"></div>
      <div id="account-menu" role="menu" hidden></div>
      <button type="button" id="account" aria-haspopup="menu" aria-expanded="false">
        <span id="account-mark"></span>
        <span id="account-name">Orochi</span>
        <span id="account-chevron"></span>
      </button>
    </footer>
    <div class="resizer" id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize the sidebar" tabindex="0"></div>
  </aside>

  <main id="thread">
    <header id="thread-head">
      <span id="thread-where"></span>
      <span id="thread-title">Nothing selected</span>
      <span id="thread-status"></span>
      <button type="button" id="threads-ctl" aria-haspopup="menu" aria-expanded="false" hidden>Threads (0)</button>
      <div id="threads-menu" role="menu" hidden></div>
    </header>
    <div id="split">
      <div id="chat">
      <div id="timeline" role="log" aria-live="polite"></div>
      <form id="composer" autocomplete="off">
        <div id="mention-list" class="mention-list" role="listbox" hidden></div>
        <textarea id="message" rows="1" placeholder="Message…" aria-label="Message"></textarea>
        <div id="composer-row">
          <div id="folder-picker">
            <button type="button" id="folder" aria-haspopup="menu" aria-expanded="false">
              <span id="folder-name">No folder</span>
            </button>
            <div id="folder-menu" role="menu" hidden></div>
          </div>
          <div id="route-picker">
            <button type="button" id="route" aria-haspopup="menu" aria-expanded="false"><span id="route-name">Auto</span></button>
            <div id="route-menu" role="menu" hidden></div>
          </div>
          <button type="button" id="effort" title="How hard the agent thinks"><span id="effort-name">default</span></button>
          <span id="composer-hint">Cmd-Enter to send &middot; Enter for a new line</span>
          <button type="button" id="interrupt" hidden>Stop</button>
          <button type="submit" id="send">Send</button>
        </div>
      </form>
      </div>
      <aside id="member-col" aria-label="Thread" hidden>
        <div class="resizer" id="member-resizer" role="separator" aria-orientation="vertical" aria-label="Resize the thread" tabindex="0"></div>
        <header id="member-head">
          <span id="member-title"></span>
          <button type="button" id="member-close" aria-label="Close" title="Close">×</button>
        </header>
        <div id="member-body"></div>
        <form id="member-form" autocomplete="off">
          <div id="member-mentions" class="mention-list" role="listbox" hidden></div>
          <textarea id="member-reply" rows="1" placeholder="Reply in thread…" aria-label="Reply in thread"></textarea>
          <div id="member-row">
            <label id="member-also"><input type="checkbox" id="member-also-box"> <span id="member-also-label">also send to the channel</span></label>
            <button type="submit" id="member-send">Reply</button>
          </div>
        </form>
      </aside>
    </div>
  </main>

  <aside id="side">
    <div class="resizer" id="side-resizer" role="separator" aria-orientation="vertical" aria-label="Resize the side pane" tabindex="0"></div>
    <div id="tabs" role="tablist">
      <button class="tab" data-pane="team" role="tab" aria-selected="true">Team</button>
      <button class="tab" data-pane="work" role="tab" aria-selected="false">Work</button>
      <button class="tab" data-pane="changes" role="tab" aria-selected="false">Changes</button>
      <button class="tab" data-pane="plan" role="tab" aria-selected="false">Plan</button>
      <button class="tab" data-pane="files" role="tab" aria-selected="false">Files</button>
    </div>
    <section id="pane-team" class="pane">
      <div id="roster"></div>
      <div id="room"></div>
      <form id="say-form">
        <input id="say" placeholder="Message the team…" aria-label="Message the team">
      </form>
      <p id="say-hint" class="empty">Delivered when the agent next checks.</p>
    </section>
    <section id="pane-work" class="pane" hidden>
      <div id="work"></div>
    </section>
    <section id="pane-changes" class="pane" hidden>
      <div id="scopes" role="tablist">
        <button type="button" class="scope" data-scope="turn" aria-selected="true">Last turn</button>
        <button type="button" class="scope" data-scope="unstaged" aria-selected="false">Unstaged</button>
        <button type="button" class="scope" data-scope="staged" aria-selected="false">Staged</button>
        <button type="button" class="scope" data-scope="branch" aria-selected="false">Branch</button>
      </div>
      <div id="files"></div>
      <form id="review-form" hidden>
        <div id="review-list"></div>
        <button type="submit" id="review-send">Send as a message</button>
      </form>
    </section>
    <section id="pane-plan" class="pane" hidden></section>
    <section id="pane-files" class="pane" hidden>
      <header id="files-head">
        <span id="files-where"></span>
        <button type="button" id="files-refresh" aria-label="Read the folder again"></button>
      </header>
      <input id="tree-search" type="search" placeholder="Search files…" aria-label="Search files">
      <div id="tree-by" role="tablist">
        <button type="button" class="by" data-by="name" aria-selected="true">Name</button>
        <button type="button" class="by" data-by="content" aria-selected="false">Content</button>
      </div>
      <div id="tree" role="tree" tabindex="0"></div>
      <div id="viewer" hidden></div>
    </section>
  </aside>

  <section id="office" aria-label="Office" hidden>
    <header id="office-head">
      <h2 id="office-title">Office</h2>
      <div id="office-stats"></div>
    </header>
    <div id="office-body"></div>
  </section>

  <section id="settings" hidden>
    <nav id="settings-nav" aria-label="Settings"></nav>
    <div id="settings-main">
      <header id="settings-head">
        <h2 id="settings-title">Settings</h2>
        <button type="button" id="settings-close" aria-label="Close">×</button>
      </header>
      <div id="settings-body"></div>
    </div>
  </section>

  <footer id="status-bar">
    <div id="accounts"></div>
    <div id="counts"></div>
  </footer>

  <dialog id="newproject" aria-labelledby="newproject-title">
    <header id="newproject-head">
      <h2 id="newproject-title">New project</h2>
      <button type="button" id="newproject-close" aria-label="Close">×</button>
    </header>
    <div id="newproject-body">
      <div class="place-label" id="newproject-label">Project</div>
      <button type="button" id="newproject-root" class="select empty" aria-labelledby="newproject-label newproject-root"></button>
      <p id="newproject-error" role="alert" hidden></p>
    </div>
    <footer id="newproject-foot">
      <button type="button" id="newproject-cancel">Cancel</button>
      <button type="button" class="primary" id="newproject-go" disabled>Create</button>
    </footer>
  </dialog>
  <dialog id="spawn" aria-labelledby="spawn-title">
    <header id="spawn-head">
      <h2 id="spawn-title">New thread</h2>
      <button type="button" id="spawn-close" aria-label="Close">×</button>
    </header>
    <div id="spawn-body">
      <div class="field-row">
        <div class="field">
          <div class="place-label" id="spawn-project-label">Project</div>
          <div id="spawn-project-picker">
            <button type="button" id="spawn-project" class="select" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="spawn-project-label spawn-project"></button>
            <div id="spawn-project-menu" role="listbox" aria-labelledby="spawn-project-label" hidden></div>
          </div>
        </div>
        <div class="field">
          <div class="place-label" id="spawn-place-label">Runs on</div>
          <div id="spawn-picker">
            <button type="button" id="spawn-place" class="select" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="spawn-place-label spawn-place"></button>
            <div id="spawn-menu" role="listbox" aria-labelledby="spawn-place-label" hidden></div>
          </div>
        </div>
      </div>
      <p id="spawn-about"></p>
      <button type="button" id="spawn-docker" role="switch" aria-checked="true" hidden>Docker inside the sandbox</button>
      <button type="button" id="spawn-worktree" role="switch" aria-checked="true" hidden>Create in a worktree</button>
      <p id="spawn-error" role="alert" hidden></p>
    </div>
    <footer id="spawn-foot">
      <button type="button" id="spawn-cancel">Cancel</button>
      <button type="button" class="primary" id="spawn-go"><span id="spawn-go-label">Create</span><kbd id="spawn-kbd"></kbd></button>
    </footer>
  </dialog>
  <dialog id="setup" aria-labelledby="setup-title">
    <header id="setup-head">
      <h2 id="setup-title">Set up Orochi</h2>
      <button type="button" id="setup-close" aria-label="Close">×</button>
    </header>
    <div id="setup-body"></div>
    <footer id="setup-foot">
      <button type="button" id="setup-details" aria-expanded="false">Show details</button>
      <button type="button" id="setup-cancel" hidden>Cancel</button>
      <button type="button" id="setup-later">Later</button>
      <button type="button" id="setup-back" hidden>Back</button>
      <button type="button" class="primary" id="setup-go">Install</button>
    </footer>
  </dialog>
  <dialog id="panel">
    <header id="panel-head">
      <h2 id="panel-title"></h2>
      <button type="button" id="panel-close" aria-label="Close">×</button>
    </header>
    <div id="panel-body"></div>
  </dialog>
  <dialog id="confirm" aria-labelledby="confirm-title">
    <h2 id="confirm-title"></h2>
    <p id="confirm-body"></p>
    <footer id="confirm-foot">
      <button type="button" id="confirm-cancel">Cancel</button>
      <button type="button" class="danger" id="confirm-go"></button>
    </footer>
  </dialog>
  <div id="context-menu" role="menu" hidden></div>
</div>
<script src="preview-data.js"></script>
<script src="preview-files.js"></script>
<script src="preview-channel.js"></script>
<script src="preview-office.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
