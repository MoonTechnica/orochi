# Its own workspace: the app is not part of the binary's, so CI never builds a webview.
[workspace]

[package]
name = "orochi-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A window onto the conversations Orochi records"
license = "MIT"

[lib]
name = "orochi_desktop"
path = "src/lib.rs"

[[bin]]
name = "orochi-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
orochi = { path = "../.." }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
