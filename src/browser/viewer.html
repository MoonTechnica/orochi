<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141416">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Orochi browser</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f5f5f7; --panel: #ffffff; --fg: #1c1c1e; --mut: #6b6b70; --line: #d8d8dc;
  --acc: #2f6fed; --on-acc: #ffffff; --warn: #b36b00; --stage: #e9e9ed;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e0e10; --panel: #1b1b1e; --fg: #f2f2f4; --mut: #9a9aa0; --line: #38383c;
          --acc: #6b9cff; --on-acc: #0e0e10; --warn: #f0b24d; --stage: #1a1a1d; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
  font: 15px/1.35 -apple-system, system-ui, "Segoe UI", sans-serif; overscroll-behavior: none; }
#app { position: fixed; left: 0; top: 0; width: 100%; height: 100vh; height: 100dvh;
  display: flex; flex-direction: column;
  padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
  border-radius: 9px; min-width: 40px; height: 38px; padding: 0 10px; touch-action: manipulation; }
button:active { background: var(--line); }
button.primary { background: var(--acc); color: var(--on-acc); border-color: var(--acc); }
button[hidden], [hidden] { display: none !important; }
#bar { display: flex; gap: 6px; padding: calc(6px + env(safe-area-inset-top)) 8px 6px; background: var(--panel);
  border-bottom: 1px solid var(--line); align-items: center; }
#address { flex: 1; min-width: 0; height: 38px; font: inherit; color: inherit; padding: 0 10px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 9px; }
#tabbtn { max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#tablist { position: absolute; z-index: 5; left: 8px; right: 8px; top: calc(54px + env(safe-area-inset-top));
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px;
  max-height: 60vh; overflow: auto; box-shadow: 0 8px 28px rgba(0,0,0,.28); }
#tablist .row { display: flex; gap: 6px; align-items: center; padding: 4px; }
#tablist .row button.pick { flex: 1; text-align: left; height: auto; min-height: 44px; padding: 6px 10px;
  overflow: hidden; }
#tablist .row small { display: block; color: var(--mut); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#tablist .empty { color: var(--mut); padding: 10px; }
#stage { position: relative; flex: 1; min-height: 0; background: var(--stage); overflow: hidden;
  touch-action: none; -webkit-user-select: none; user-select: none; }
#zoom { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; }
#view { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
#banner { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 4; display: flex; gap: 8px;
  align-items: center; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; color: var(--warn); }
#banner span { flex: 1; }
#dialog { position: absolute; z-index: 6; left: 12px; right: 12px; top: 12px; padding: 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 8px 28px rgba(0,0,0,.28); }
#dialog p { margin: 0 0 10px; white-space: pre-wrap; word-break: break-word; }
#dialog input { width: 100%; height: 38px; font: inherit; padding: 0 10px; margin-bottom: 10px;
  color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; }
#dialog .buttons { display: flex; gap: 8px; justify-content: flex-end; }
#keys { display: flex; gap: 5px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); overflow-x: auto;
  background: var(--panel); border-top: 1px solid var(--line); }
#keys button { flex: 0 0 auto; min-width: 44px; }
#typing { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0.01; border: 0; padding: 0;
  font-size: 16px; resize: none; background: transparent; color: transparent; caret-color: transparent; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--mut); margin-right: 6px; }
.dot.on { background: #34c759; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button id="tabbtn" type="button" aria-haspopup="true" aria-expanded="false"><span class="dot" id="dot"></span><span id="tabname">Tabs</span></button>
    <button id="back" type="button" aria-label="Back">&#8249;</button>
    <button id="forward" type="button" aria-label="Forward">&#8250;</button>
    <button id="reload" type="button" aria-label="Reload">&#8635;</button>
    <input id="address" type="text" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off"
           spellcheck="false" placeholder="Type a web address" aria-label="Address">
  </div>
  <div id="tablist" hidden></div>
  <div id="stage">
    <div id="zoom"><canvas id="view" width="2" height="2"></canvas></div>
    <div id="banner" hidden><span id="bannertext"></span><button id="bannerbtn" type="button" class="primary" hidden></button></div>
    <div id="dialog" hidden><p id="dialogtext"></p><input id="dialoginput" type="text" hidden>
      <div class="buttons"><button id="dialogno" type="button">Cancel</button><button id="dialogyes" type="button" class="primary">OK</button></div></div>
  </div>
  <div id="keys">
    <button id="kbd" type="button" aria-label="Keyboard">&#9000;</button>
    <button type="button" data-key="Escape">Esc</button>
    <button type="button" data-key="Tab">Tab</button>
    <button type="button" data-key="ArrowLeft">&#8592;</button>
    <button type="button" data-key="ArrowUp">&#8593;</button>
    <button type="button" data-key="ArrowDown">&#8595;</button>
    <button type="button" data-key="ArrowRight">&#8594;</button>
    <button type="button" data-key="Enter">&#9166;</button>
    <button type="button" data-key="Backspace">&#9003;</button>
    <button type="button" id="zoomreset" hidden>1&times;</button>
  </div>
  <textarea id="typing" aria-label="Page input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
</div>
<script>
(function () {
"use strict";

// The key mapping is the window's (desktop/src/app.js, "A browser tab"), copied rather than shared.
var VK = {
  Enter: 13, Backspace: 8, Tab: 9, Escape: 27, Delete: 46, Home: 36, End: 35, PageUp: 33, PageDown: 34,
  ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40
};
var CODES = { Enter: "Enter", Backspace: "Backspace", Tab: "Tab", Escape: "Escape", Delete: "Delete",
  ArrowLeft: "ArrowLeft", ArrowUp: "ArrowUp", ArrowRight: "ArrowRight", ArrowDown: "ArrowDown" };
function modifiersOf(event) {
  return (event.altKey ? 1 : 0) | (event.ctrlKey ? 2 : 0) | (event.metaKey ? 4 : 0) | (event.shiftKey ? 8 : 0);
}
function addressOf(typed) {
  var value = String(typed || "").trim();
  if (!value) return null;
  if (/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) return value;
  if (/^(localhost|127\.|\[::1\]|\d+\.\d+\.\d+\.\d+)/i.test(value)) return "http://" + value;
  if (/^[^\s/]+\.[a-z]{2,}([/:?#].*)?$/i.test(value)) return "https://" + value;
  return null;
}

var $ = function (id) { return document.getElementById(id); };
var stage = $("stage"), canvas = $("view"), zoomBox = $("zoom"), typing = $("typing"), address = $("address");
var ctx = canvas.getContext("2d");
var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
function remember(key, value) { try { localStorage.setItem("orochi-remote:" + key, value); } catch (e) { /* private mode */ } }
function recall(key) { try { return localStorage.getItem("orochi-remote:" + key); } catch (e) { return null; } }

// -- the socket ------------------------------------------------------------------------------

var ws = null, connected = false, everOpened = false, failures = 0, backoff = 500, generation = 0;
var nextId = 1, pending = new Map();
var device = null, own = null, scope = null, tabs = [], mine = false, driving = false;
var since = 0, lastRatio = 1, pageW = 0, pageH = 0;

function rejectAll(why) {
  pending.forEach(function (p) { p.reject(new Error(why)); });
  pending.clear();
}

function connect() {
  var mark = ++generation;
  var url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
  var opened = false;
  try { ws = new WebSocket(url); } catch (e) { retry(mark, opened); return; }
  ws.binaryType = "arraybuffer";
  ws.onopen = function () {
    if (mark !== generation) return;
    opened = true; everOpened = true; failures = 0; backoff = 500; connected = true;
    notice("", null); $("dot").className = "dot on";
    start().catch(function (e) { notice(String(e.message || e), null); });
  };
  ws.onmessage = function (event) {
    if (mark !== generation) return;
    var message, frame = null;
    if (typeof event.data === "string") {
      try { message = JSON.parse(event.data); } catch (e) { return; }
    } else {
      var view = new DataView(event.data);
      var headerLength = view.getUint32(0);
      try { message = JSON.parse(new TextDecoder().decode(new Uint8Array(event.data, 4, headerLength))); } catch (e) { return; }
      frame = event.data.slice(4 + headerLength);
    }
    var wait = pending.get(message.id);
    if (!wait) return;
    pending.delete(message.id);
    if (message.error) wait.reject(new Error(message.error));
    else wait.resolve({ ok: message.ok, frame: frame });
  };
  ws.onclose = function () {
    if (mark !== generation) return;
    connected = false; $("dot").className = "dot";
    rejectAll("disconnected");
    retry(mark, opened);
  };
  ws.onerror = function () { /* onclose follows */ };
}

function retry(mark, opened) {
  if (!opened) failures++;
  if (!everOpened && failures >= 2) {
    notice("This phone is not paired, or was removed.", { label: "Pair again", run: function () { location.replace("/pair"); } });
  } else {
    notice("Reconnecting…", null);
  }
  var wait = backoff; backoff = Math.min(8000, Math.round(backoff * 1.6));
  setTimeout(function () { if (mark === generation) connect(); }, wait);
}

function call(tool, args, forScope) {
  return new Promise(function (resolve, reject) {
    if (!connected || !ws || ws.readyState !== 1) { reject(new Error("disconnected")); return; }
    var id = nextId++;
    pending.set(id, { resolve: resolve, reject: reject });
    var message = { id: id, tool: tool, args: args || {} };
    if (forScope !== undefined ? forScope : scope) message.scope = forScope !== undefined ? forScope : scope;
    ws.send(JSON.stringify(message));
  });
}

// -- banner, dialog --------------------------------------------------------------------------

var bannerAction = null;
function notice(text, action) {
  $("banner").hidden = !text;
  $("bannertext").textContent = text || "";
  bannerAction = action;
  $("bannerbtn").hidden = !action;
  if (action) $("bannerbtn").textContent = action.label;
}
$("bannerbtn").addEventListener("click", function () { if (bannerAction) bannerAction.run(); });

var shownDialog = null;
function showDialog(dialog) {
  var key = dialog ? dialog.type + "|" + dialog.message : null;
  if (key === shownDialog) return;
  shownDialog = key;
  $("dialog").hidden = !dialog;
  if (!dialog) return;
  $("dialogtext").textContent = dialog.message || "";
  $("dialoginput").hidden = dialog.type !== "prompt";
  $("dialoginput").value = "";
  $("dialogno").hidden = dialog.type === "alert";
}
function answerDialog(accept) {
  call("view_dialog", { accept: accept, text: $("dialoginput").value || "" }).catch(function (e) { notice(e.message, null); });
}
$("dialogyes").addEventListener("click", function () { answerDialog(true); });
$("dialogno").addEventListener("click", function () { answerDialog(false); });

// -- tabs ------------------------------------------------------------------------------------

async function start() {
  var hello = await call("ping", {}, null);
  device = hello.ok && hello.ok.device;
  own = device ? "user:phone-" + device + ":" : null;
  await refreshTabs();
  var wanted = recall("scope");
  var pick = tabs.find(function (t) { return t.scope === wanted; }) || tabs.find(function (t) { return own && t.scope.indexOf(own) === 0; }) || tabs[0];
  if (pick) await select(pick.scope);
  else await newTab();
}

async function refreshTabs() {
  var r = await call("view_list", {}, null);
  tabs = (r.ok && r.ok.tabs) || [];
  return tabs;
}

function labelOf(tab) { return tab.title || tab.url || "Blank page"; }

async function select(next) {
  scope = next; since = 0; remember("scope", next);
  mine = !!own && next.indexOf(own) === 0;
  var tab = tabs.find(function (t) { return t.scope === next; });
  $("tabname").textContent = tab ? labelOf(tab) : "Tab";
  zoomReset();
  if (mine) { driving = true; notice("", null); await resize(); }
  else { driving = false; watching(); }
}

function watching() {
  notice("Watching a tab on the computer. You can only look until you take control.", {
    label: "Take control",
    run: function () { takeControl().catch(function (e) { notice(e.message, null); }); }
  });
}

async function takeControl() {
  await call("take_control", {});
  driving = true; notice("", null); since = 0;
  await resize();
}

async function newTab() {
  if (!own) return;
  var name = "t" + Math.floor(Math.random() * 46656).toString(36);
  var next = own + name;
  try {
    await call("view_open", { url: "" }, next);
  } catch (e) { notice(e.message, null); return; }
  await refreshTabs();
  if (!tabs.some(function (t) { return t.scope === next; })) tabs.push({ scope: next, title: "New tab", url: "", engine: "" });
  await select(next);
  address.focus();
}

async function closeTab(target) {
  try { await call("view_close", {}, target); } catch (e) { notice(e.message, null); }
  await refreshTabs();
  if (target === scope) {
    var other = tabs[0];
    scope = null;
    if (other) await select(other.scope); else await newTab();
  }
  drawTabs();
}

function drawTabs() {
  var list = $("tablist");
  list.replaceChildren();
  if (!tabs.length) {
    var empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "No tabs are open."; list.append(empty);
  }
  tabs.forEach(function (tab) {
    var row = document.createElement("div"); row.className = "row";
    var pick = document.createElement("button"); pick.type = "button"; pick.className = "pick";
    var title = document.createElement("div"); title.textContent = labelOf(tab) + (tab.scope === scope ? " ✓" : "");
    var small = document.createElement("small");
    var yours = own && tab.scope.indexOf(own) === 0;
    small.textContent = (yours ? "this phone" : "on the computer") + (tab.engine ? " · " + tab.engine : "") + (tab.url ? " · " + tab.url : "");
    pick.append(title, small);
    pick.addEventListener("click", function () { toggleTabs(false); select(tab.scope).catch(function (e) { notice(e.message, null); }); });
    row.append(pick);
    if (yours) {
      var close = document.createElement("button"); close.type = "button"; close.textContent = "✕"; close.setAttribute("aria-label", "Close tab");
      close.addEventListener("click", function () { closeTab(tab.scope); });
      row.append(close);
    }
    list.append(row);
  });
  var add = document.createElement("div"); add.className = "row";
  var plus = document.createElement("button"); plus.type = "button"; plus.className = "pick primary"; plus.textContent = "+ New tab";
  plus.addEventListener("click", function () { toggleTabs(false); newTab(); });
  add.append(plus); list.append(add);
}

function toggleTabs(open) {
  var list = $("tablist");
  var show = open === undefined ? list.hidden : open;
  list.hidden = !show;
  $("tabbtn").setAttribute("aria-expanded", String(show));
  if (show) { refreshTabs().then(drawTabs).catch(function () { drawTabs(); }); drawTabs(); }
}
$("tabbtn").addEventListener("click", function () { toggleTabs(); });

// -- the address bar and the page buttons ------------------------------------------------------

function act(tool, args) {
  return call(tool, args || {}).catch(function (e) { handleError(e); });
}
function handleError(e) {
  if (/driving/.test(e.message)) {
    driving = false;
    notice("Another viewer is driving this tab.", { label: "Take control", run: function () { takeControl().catch(function (x) { notice(x.message, null); }); } });
  } else if (e.message !== "disconnected") {
    notice(e.message, null);
  }
}
$("back").addEventListener("click", function () { act("view_back"); });
$("forward").addEventListener("click", function () { act("view_forward"); });
$("reload").addEventListener("click", function () { act("view_reload"); });
address.addEventListener("keydown", function (event) {
  if (event.key !== "Enter" || event.isComposing) return;
  var target = addressOf(address.value);
  if (!target) { notice("That is not a web address.", null); return; }
  address.blur();
  act("view_navigate", { url: target });
});

// -- size ------------------------------------------------------------------------------------

async function resize() {
  if (!scope || !driving) return;
  var w = Math.max(100, Math.round(stage.clientWidth)), h = Math.max(100, Math.round(stage.clientHeight));
  lastRatio = Math.min(2, window.devicePixelRatio || 1);
  pageW = w; pageH = h; since = 0;
  try { await call("view_resize", { width: w, height: h, ratio: lastRatio }); }
  catch (e) { handleError(e); }
}
var resizeTimer = 0;
function resizeSoon() { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150); }
if (typeof ResizeObserver === "function") new ResizeObserver(resizeSoon).observe(stage);
window.addEventListener("orientationchange", resizeSoon);

// With the keyboard up, the visible part of the page is the visual viewport, not the layout one.
function fit() {
  var vv = window.visualViewport;
  var app = $("app");
  if (vv) { app.style.height = vv.height + "px"; app.style.top = vv.offsetTop + "px"; }
  window.scrollTo(0, 0);
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", fit);
  window.visualViewport.addEventListener("scroll", fit);
}
fit();

// -- frames ----------------------------------------------------------------------------------

var lastFrame = { w: 0, h: 0 };
function paint(buffer) {
  var blob = new Blob([buffer], { type: "image/jpeg" });
  if (typeof createImageBitmap === "function") {
    createImageBitmap(blob).then(function (bitmap) { draw(bitmap, bitmap.width, bitmap.height); if (bitmap.close) bitmap.close(); }, function () {});
    return;
  }
  var url = URL.createObjectURL(blob), image = new Image();
  image.onload = function () { draw(image, image.width, image.height); URL.revokeObjectURL(url); };
  image.onerror = function () { URL.revokeObjectURL(url); };
  image.src = url;
}
function draw(source, w, h) {
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  lastFrame = { w: w, h: h };
  ctx.drawImage(source, 0, 0);
}

async function frames() {
  for (;;) {
    if (!connected || !scope || document.hidden) { await sleep(300); continue; }
    var got = false;
    try {
      var r = await call("view_frame", { since: since, width: Math.round(stage.clientWidth), height: Math.round(stage.clientHeight) });
      var ok = r.ok || {};
      if (ok.frame && r.frame) { since = ok.frame.seq; paint(r.frame); got = true; }
      if (ok.url && document.activeElement !== address && address.value !== ok.url) address.value = ok.url;
      if (ok.title) $("tabname").textContent = ok.title;
      showDialog(ok.dialog || null);
    } catch (e) {
      await sleep(e.message === "disconnected" ? 500 : 800);
      continue;
    }
    await sleep(got ? 25 : 90);
  }
}

// -- input -----------------------------------------------------------------------------------

var tail = Promise.resolve();
function input(args) {
  // One event at a time, in order: a press must not overtake a move, nor a key-up its key-down.
  tail = tail.then(function () { return call("view_input", args); }).catch(function (e) { handleError(e); });
  return tail;
}

// The page as the engine sees it, in CSS pixels, from a point on the screen.
function contentRect() {
  var box = canvas.getBoundingClientRect();
  if (!lastFrame.w || !lastFrame.h) return box;
  var scale = Math.min(box.width / lastFrame.w, box.height / lastFrame.h);
  var w = lastFrame.w * scale, h = lastFrame.h * scale;
  return { left: box.left + (box.width - w) / 2, top: box.top + (box.height - h) / 2, width: w, height: h };
}
function place(clientX, clientY) {
  var r = contentRect();
  var cssW = (lastFrame.w || r.width) / lastRatio, cssH = (lastFrame.h || r.height) / lastRatio;
  return {
    x: Math.max(0, Math.min(cssW, ((clientX - r.left) * cssW) / (r.width || 1))),
    y: Math.max(0, Math.min(cssH, ((clientY - r.top) * cssH) / (r.height || 1)))
  };
}
function mouse(kind, at, extra) {
  return input(Object.assign({ type: "mouse", kind: kind, x: at.x, y: at.y, button: "none", buttons: 0, modifiers: 0 }, extra || {}));
}
function click(at, count) {
  mouse("mouseMoved", at);
  mouse("mousePressed", at, { button: "left", buttons: 1, clickCount: count });
  mouse("mouseReleased", at, { button: "left", buttons: 0, clickCount: count });
}
function rightClick(at) {
  mouse("mouseMoved", at);
  mouse("mousePressed", at, { button: "right", buttons: 2, clickCount: 1 });
  mouse("mouseReleased", at, { button: "right", buttons: 0, clickCount: 1 });
}

// Local magnifier: a pinch scales the picture on this phone only. The page's own zoom, and its
// layout, are not changed (there is no such call), so this is for reading small text.
var zoom = { s: 1, x: 0, y: 0 };
function applyZoom() {
  zoomBox.style.transform = "translate(" + zoom.x + "px," + zoom.y + "px) scale(" + zoom.s + ")";
  $("zoomreset").hidden = zoom.s === 1;
  $("zoomreset").textContent = zoom.s.toFixed(1) + "×";
}
function zoomReset() { zoom = { s: 1, x: 0, y: 0 }; applyZoom(); }
$("zoomreset").addEventListener("click", zoomReset);
function clampZoom() {
  var w = stage.clientWidth, h = stage.clientHeight;
  zoom.s = Math.max(1, Math.min(4, zoom.s));
  zoom.x = Math.min(0, Math.max(w - w * zoom.s, zoom.x));
  zoom.y = Math.min(0, Math.max(h - h * zoom.s, zoom.y));
}

var touches = new Map();
var g = { mode: null, sx: 0, sy: 0, lx: 0, ly: 0, st: 0, long: 0, fired: false, moved: false,
          lastTap: { t: 0, x: 0, y: 0 }, accX: 0, accY: 0, raf: 0, vx: 0, vy: 0, lt: 0,
          d0: 0, s0: 1, cx: 0, cy: 0, pinching: false, tx: 0, ty: 0, momentum: 0 };

function guard() {
  if (!scope) return false;
  if (!driving) { watching(); return false; }
  return true;
}
function flushScroll() {
  g.raf = 0;
  if (!g.accX && !g.accY) return;
  var at = place(g.lx, g.ly);
  mouse("mouseWheel", at, { deltaX: g.accX, deltaY: g.accY });
  g.accX = 0; g.accY = 0;
}
function scrollBy(dx, dy) {
  g.accX += dx; g.accY += dy;
  if (!g.raf) g.raf = requestAnimationFrame(flushScroll);
}
function stopMomentum() { if (g.momentum) { cancelAnimationFrame(g.momentum); g.momentum = 0; } }
function glide() {
  g.vx *= 0.94; g.vy *= 0.94;
  if (Math.abs(g.vx) < 0.4 && Math.abs(g.vy) < 0.4) { g.momentum = 0; return; }
  scrollBy(g.vx, g.vy);
  g.momentum = requestAnimationFrame(glide);
}

stage.addEventListener("touchstart", function (event) {
  event.preventDefault();
  if (!$("tablist").hidden) toggleTabs(false);
  stopMomentum();
  Array.prototype.forEach.call(event.changedTouches, function (t) { touches.set(t.identifier, t); });
  if (touches.size === 1) {
    var t = event.changedTouches[0];
    g.mode = "one"; g.sx = g.lx = t.clientX; g.sy = g.ly = t.clientY; g.st = g.lt = Date.now();
    g.fired = false; g.moved = false; g.vx = g.vy = 0;
    clearTimeout(g.long);
    g.long = setTimeout(function () {
      if (g.mode !== "one" || g.moved || !guard()) return;
      g.fired = true;
      if (navigator.vibrate) navigator.vibrate(12);
      rightClick(place(g.sx, g.sy));
    }, 500);
  } else if (touches.size === 2) {
    clearTimeout(g.long);
    var pair = Array.from(touches.values());
    g.mode = "two"; g.pinching = false;
    g.d0 = Math.hypot(pair[0].clientX - pair[1].clientX, pair[0].clientY - pair[1].clientY) || 1;
    g.s0 = zoom.s; g.cx = (pair[0].clientX + pair[1].clientX) / 2; g.cy = (pair[0].clientY + pair[1].clientY) / 2;
    g.tx = zoom.x; g.ty = zoom.y; g.lx = g.cx; g.ly = g.cy;
  }
}, { passive: false });

stage.addEventListener("touchmove", function (event) {
  event.preventDefault();
  Array.prototype.forEach.call(event.changedTouches, function (t) { touches.set(t.identifier, t); });
  if (g.mode === "one" && touches.size === 1) {
    var t = event.changedTouches[0];
    if (!g.moved && Math.hypot(t.clientX - g.sx, t.clientY - g.sy) > 10) { g.moved = true; clearTimeout(g.long); }
    if (!g.moved || g.fired) return;
    if (!guard()) return;
    var now = Date.now(), dt = Math.max(1, now - g.lt);
    var dx = g.lx - t.clientX, dy = g.ly - t.clientY;
    g.vx = dx / dt * 16; g.vy = dy / dt * 16;
    g.lx = t.clientX; g.ly = t.clientY; g.lt = now;
    // A finger moving up is the page moving up: the wheel turns down.
    scrollBy(dx / zoom.s, dy / zoom.s);
  } else if (g.mode === "two" && touches.size >= 2) {
    var pair = Array.from(touches.values());
    var d = Math.hypot(pair[0].clientX - pair[1].clientX, pair[0].clientY - pair[1].clientY) || 1;
    var cx = (pair[0].clientX + pair[1].clientX) / 2, cy = (pair[0].clientY + pair[1].clientY) / 2;
    if (!g.pinching && Math.abs(d - g.d0) > 14) g.pinching = true;
    if (g.pinching) {
      var s = Math.max(1, Math.min(4, g.s0 * d / g.d0));
      var rect = stage.getBoundingClientRect();
      var px = (g.cx - rect.left - g.tx) / g.s0, py = (g.cy - rect.top - g.ty) / g.s0;
      zoom.s = s; zoom.x = (cx - rect.left) - px * s; zoom.y = (cy - rect.top) - py * s;
      clampZoom(); applyZoom();
    } else if (guard()) {
      var ddx = g.lx - cx, ddy = g.ly - cy;
      g.lx = cx; g.ly = cy;
      scrollBy(ddx / zoom.s, ddy / zoom.s);
    }
  }
}, { passive: false });

function release(event) {
  event.preventDefault();
  Array.prototype.forEach.call(event.changedTouches, function (t) { touches.delete(t.identifier); });
  if (g.mode === "one" && touches.size === 0) {
    clearTimeout(g.long);
    if (!g.moved && !g.fired && event.type === "touchend" && guard()) {
      var t = event.changedTouches[0], now = Date.now();
      var again = now - g.lastTap.t < 350 && Math.hypot(t.clientX - g.lastTap.x, t.clientY - g.lastTap.y) < 30;
      click(place(t.clientX, t.clientY), again ? 2 : 1);
      g.lastTap = again ? { t: 0, x: 0, y: 0 } : { t: now, x: t.clientX, y: t.clientY };
      // Where the keyboard goes is the page's business; the keyboard key opens it.
    } else if (g.moved && !g.fired && event.type === "touchend" && Date.now() - g.lt < 80 &&
               (Math.abs(g.vx) > 2 || Math.abs(g.vy) > 2)) {
      g.momentum = requestAnimationFrame(glide);
    }
    g.mode = null;
  } else if (touches.size === 0) {
    g.mode = null; g.pinching = false;
  } else if (touches.size === 1 && g.mode === "two") {
    // One finger left of a pinch: it does not become a tap or a scroll.
    g.mode = "spent";
  }
}
stage.addEventListener("touchend", release, { passive: false });
stage.addEventListener("touchcancel", release, { passive: false });

// A mouse or pen on a tablet works as it does in the window.
stage.addEventListener("mousedown", function (e) {
  if (!guard()) return;
  e.preventDefault();
  mouse("mousePressed", place(e.clientX, e.clientY), { button: ["left", "middle", "right"][e.button] || "left", buttons: e.buttons || 1, clickCount: e.detail || 1, modifiers: modifiersOf(e) });
});
stage.addEventListener("mouseup", function (e) {
  if (!guard()) return;
  mouse("mouseReleased", place(e.clientX, e.clientY), { button: ["left", "middle", "right"][e.button] || "left", clickCount: e.detail || 1, modifiers: modifiersOf(e) });
});
var movedAt = 0;
stage.addEventListener("mousemove", function (e) {
  var now = Date.now();
  if (now - movedAt < 40 || !guard()) return;
  movedAt = now;
  mouse("mouseMoved", place(e.clientX, e.clientY), { button: e.buttons ? "left" : "none", buttons: e.buttons || 0 });
});
stage.addEventListener("wheel", function (e) {
  if (!guard()) return;
  e.preventDefault();
  mouse("mouseWheel", place(e.clientX, e.clientY), { deltaX: e.deltaX, deltaY: e.deltaY });
}, { passive: false });
stage.addEventListener("contextmenu", function (e) { e.preventDefault(); });

// The soft keyboard: a hidden textarea, so the phone's own input method works and only the
// composed text is sent.
function pressKey(key) {
  if (!guard()) return;
  var vk = VK[key] || 0;
  input({ type: "key", kind: "rawKeyDown", key: key, code: CODES[key] || key, vk: vk, modifiers: 0, text: "" });
  input({ type: "key", kind: "keyUp", key: key, code: CODES[key] || key, vk: vk, modifiers: 0 });
}
var composing = false;
typing.addEventListener("compositionstart", function () { composing = true; });
typing.addEventListener("compositionupdate", function (e) {
  if (guard()) input({ type: "ime", text: e.data || "", commit: false });
});
typing.addEventListener("compositionend", function (e) {
  composing = false;
  if (guard()) input({ type: "ime", text: e.data || "", commit: true });
  setTimeout(function () { typing.value = ""; }, 0);
});
typing.addEventListener("keydown", function (e) {
  if (composing || e.isComposing || e.keyCode === 229 || e.metaKey) return;
  e.preventDefault();
  if (!guard()) return;
  var printable = e.key.length === 1 && !e.ctrlKey && !e.altKey;
  input({ type: "key", kind: printable ? "keyDown" : "rawKeyDown", key: e.key, code: e.code, vk: VK[e.key] || e.keyCode || 0,
          modifiers: modifiersOf(e), text: printable ? e.key : "" });
});
typing.addEventListener("keyup", function (e) {
  if (composing || e.isComposing || e.keyCode === 229 || e.metaKey) return;
  e.preventDefault();
  if (!guard()) return;
  input({ type: "key", kind: "keyUp", key: e.key, code: e.code, vk: VK[e.key] || e.keyCode || 0, modifiers: modifiersOf(e) });
});
typing.addEventListener("beforeinput", function (e) {
  if (composing || e.isComposing) return;
  var kind = e.inputType;
  if (kind === "insertText" || kind === "insertFromPaste" || kind === "insertReplacementText") {
    e.preventDefault();
    if (e.data && guard()) input({ type: "text", text: e.data });
  } else if (kind === "insertLineBreak" || kind === "insertParagraph") {
    e.preventDefault(); pressKey("Enter");
  } else if (kind === "deleteContentBackward") {
    e.preventDefault(); pressKey("Backspace");
  } else if (kind === "deleteContentForward") {
    e.preventDefault(); pressKey("Delete");
  }
});
typing.addEventListener("paste", function (e) {
  var pasted = e.clipboardData && e.clipboardData.getData && e.clipboardData.getData("text/plain");
  if (!pasted) return;
  e.preventDefault();
  if (guard()) input({ type: "text", text: pasted });
});

$("kbd").addEventListener("click", function () {
  if (document.activeElement === typing) typing.blur(); else typing.focus();
});
// A key must not take the focus, or the keyboard would close on every press.
document.getElementById("keys").addEventListener("mousedown", function (e) { e.preventDefault(); });
document.getElementById("keys").addEventListener("touchstart", function (e) {
  if (e.target.closest && e.target.closest("button[data-key]")) e.preventDefault();
}, { passive: false });
Array.prototype.forEach.call(document.querySelectorAll("button[data-key]"), function (b) {
  b.addEventListener("click", function () { pressKey(b.getAttribute("data-key")); });
});

document.addEventListener("visibilitychange", function () { if (!document.hidden) since = 0; });

notice("Connecting…", null);
connect();
frames();
})();
</script>
</body>
</html>
